plugins {
    id 'fabric-loom'
}

base {
    archivesName = 'herobrineultimate-fabric'
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
}

sourceSets.main {
    java.srcDir '../common/src/main/java'
    resources.srcDir '../common/src/main/resources'
}

loom {
    mixin {
        defaultRefmapName = 'herobrineultimate.refmap.json'
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

// Framing regressions use actual mapped Minecraft NBT and Netty; never packaged.
sourceSets {
    packetTest {
        java.srcDir '../tests/fabric'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
tasks.register('packetTest', JavaExec) {
    dependsOn tasks.named('packetTestClasses')
    classpath = sourceSets.packetTest.runtimeClasspath
    mainClass = 'com.yutadigital.herobrine.fabric.FabricPacketDecodeTest'
    enableAssertions = true
}
tasks.named('check') { dependsOn tasks.named('packetTest') }
